name: Tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
        laravel: ['12.*', '13.*']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, sqlite3, pdo_sqlite
          coverage: none
      - run: composer require --no-interaction --no-update illuminate/database:${{ matrix.laravel }} illuminate/support:${{ matrix.laravel }} orchestra/testbench:${{ matrix.laravel == '12.*' && '^10.0' || '^11.0' }}
      - run: composer update --prefer-dist --no-interaction
      - run: composer validate --strict
      - run: composer test
